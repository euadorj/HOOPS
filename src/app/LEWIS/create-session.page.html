<ion-header>
  <ion-toolbar class="create-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab2" text="" color="light"></ion-back-button>
    </ion-buttons>
    <div class="header-content">
      <ion-title class="header-title">Create Session</ion-title>
      <p class="header-subtitle">Build your menu, categories, and pricing</p>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="create-content">
  <div class="create-container">
    <div class="form-card">
      <div class="field-group">
        <label>Session Code</label>
        <input
          type="text"
          maxlength="6"
          inputmode="numeric"
          [(ngModel)]="sessionCode"
          placeholder="Enter 6-digit code"
          name="sessionCode"
        />
      </div>

      <div class="field-group">
        <label>Session Title</label>
        <input
          type="text"
          [(ngModel)]="sessionTitle"
          placeholder="Enter the session name"
          name="sessionTitle"
        />
      </div>

      <div class="field-group">
        <label>Restaurant Name</label>
        <input
          type="text"
          [(ngModel)]="restaurantName"
          placeholder="Enter the restaurant's name"
          name="restaurantName"
        />
      </div>

      <div class="section-divider">
        <ion-icon name="restaurant-outline"></ion-icon>
        <span>Menu Categories</span>
      </div>

      <div class="category-card" *ngFor="let category of categories; let catIndex = index">
        <div class="category-header">
          <input
            type="text"
            class="category-title-input"
            [(ngModel)]="category.title"
            placeholder="Category title"
            name="categoryTitle{{ catIndex }}"
          />
          <button class="icon-button danger" type="button" (click)="removeCategory(catIndex)" aria-label="Remove category">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
        </div>

        <div class="menu-item-card" *ngFor="let item of category.items; let itemIndex = index">
          <div class="menu-item-row">
            <input
              type="text"
              [(ngModel)]="item.title"
              placeholder="Item name"
              name="itemTitle{{ catIndex }}-{{ itemIndex }}"
            />
            <input
              type="number"
              [(ngModel)]="item.price"
              placeholder="Price"
              name="itemPrice{{ catIndex }}-{{ itemIndex }}"
            />
            <button class="icon-button" type="button" (click)="removeItem(category, itemIndex)" aria-label="Remove item">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </div>
        </div>

        <button class="add-item-button" type="button" (click)="addItem(category)">
          <ion-icon name="add-outline"></ion-icon>
          Add Item
        </button>
      </div>

      <button class="add-button" type="button" (click)="addCategory()">
        <ion-icon name="add-circle-outline"></ion-icon>
        Add Category
      </button>

      <div class="validation-error" *ngIf="validationMessage">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ validationMessage }}
      </div>

      <ion-button class="create-button" expand="block" [disabled]="submitting" (click)="create()">
        {{ submitting ? 'Creating...' : 'Create Session' }}
        <ion-icon *ngIf="!submitting" name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
