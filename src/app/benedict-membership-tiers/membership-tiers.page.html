<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/BENEDICT_REWARDS"></ion-back-button>
    </ion-buttons>
    <ion-title>Membership Tiers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="page-sub" *ngIf="currentTier">
    Your current tier: <b>{{ currentTier.memberLabel }}</b>
  </div>

  <ion-card
    *ngFor="let tier of tiers"
    class="tier-card"
    [ngClass]="[tier.cardClass, isCurrentTier(tier) ? 'current' : '']"
  >
    <ion-card-header>
      <ion-card-title>{{ tier.memberLabel }} Rewards</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p *ngFor="let reward of tier.rewards">• {{ reward }}</p>
      <p>• Points multiplier: {{ tier.multiplier }}x</p>
    </ion-card-content>
  </ion-card>
</ion-content>
